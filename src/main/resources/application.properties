# HTTP — Railway injects PORT automatically
quarkus.http.port=${PORT:8080}

# ── Dev mode (local) ────────────────────────────────────────────────────────
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=familytree
%dev.quarkus.datasource.password=familytree
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/familytree
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

# ── Production (Railway PostgreSQL) ─────────────────────────────────────────
# Railway injects PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD automatically
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
%prod.quarkus.datasource.username=${PGUSER}
%prod.quarkus.datasource.password=${PGPASSWORD}
%prod.quarkus.hibernate-orm.database.generation=update

# ── Swagger UI (always available) ───────────────────────────────────────────
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=FamilyTree API
quarkus.smallrye-openapi.info-version=1.0.0
